name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Verificar importação do bot e das bibliotecas do Google
        run: python -c "import bot.__main__, bot.sheets; import googleapiclient.discovery, google_auth_oauthlib.flow"
      - name: Testes
        run: python -W error::DeprecationWarning -m unittest -v
